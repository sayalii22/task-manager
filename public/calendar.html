<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Interactive calendar view to schedule, inspect deadlines, and track tasks across the month.">
  <title>Calendar View &bull; TaskPulse Manager</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="app-layout">
    <!-- Sidebar Navigation -->
    <aside class="app-sidebar">
      <div class="sidebar-brand">
        <div class="brand-icon">
          <i class="fa-solid fa-list-check"></i>
        </div>
        <span class="brand-title">TaskPulse</span>
      </div>

      <nav class="sidebar-nav">
        <span class="nav-label">Navigation</span>
        <a href="/dashboard" class="nav-link">
          <i class="fa-solid fa-chart-pie"></i>
          <span>Dashboard</span>
        </a>
        <a href="/tasks" class="nav-link">
          <i class="fa-solid fa-table-columns"></i>
          <span>Tasks & Board</span>
        </a>
        <a href="/calendar" class="nav-link active">
          <i class="fa-regular fa-calendar-days"></i>
          <span>Calendar</span>
        </a>

        <span class="nav-label" style="margin-top: 16px;">Quick Actions</span>
        <button class="nav-link" onclick="window.openCreateTaskModal()" style="text-align: left; width: 100%;">
          <i class="fa-solid fa-circle-plus" style="color: var(--primary);"></i>
          <span>Add New Task</span>
        </button>
      </nav>

      <!-- Sidebar User Footer -->
      <div class="sidebar-footer">
        <div class="user-avatar">
          <span class="user-avatar-text">U</span>
        </div>
        <div class="user-info">
          <div class="user-name">Loading...</div>
          <div class="user-email">...</div>
        </div>
        <button class="btn-icon btn-logout" title="Log Out">
          <i class="fa-solid fa-arrow-right-from-bracket"></i>
        </button>
      </div>
    </aside>

    <!-- Main View -->
    <main class="app-main">
      <!-- Header -->
      <header class="app-header">
        <div class="header-left">
          <button class="btn-icon sidebar-toggle-btn" title="Toggle Sidebar">
            <i class="fa-solid fa-bars"></i>
          </button>
          <div class="page-title-box">
            <h1>Calendar Schedule</h1>
            <p>View upcoming deliverables, track deadlines, and schedule tasks.</p>
          </div>
        </div>

        <div class="header-right">
          <!-- Notification Bell -->
          <div class="notification-wrapper">
            <button class="btn-icon notification-toggle" title="Notifications">
              <i class="fa-regular fa-bell"></i>
            </button>
            <span class="notification-badge" style="display: none;">0</span>

            <div class="notification-dropdown">
              <div class="notif-header">
                <h4><i class="fa-solid fa-bell"></i> Reminders & Alerts</h4>
              </div>
              <div class="notif-list">
                <div style="text-align: center; color: var(--text-tertiary); padding: 16px;">Scanning deadlines...</div>
              </div>
            </div>
          </div>

          <!-- Theme Toggle -->
          <button class="btn-icon theme-toggle-btn" title="Toggle Light/Dark Theme">
            <i class="fa-solid fa-moon"></i>
          </button>

          <!-- Create Task CTA -->
          <button class="btn-primary" onclick="window.openCreateTaskModal()">
            <i class="fa-solid fa-plus"></i> New Task
          </button>
        </div>
      </header>

      <!-- Page Content -->
      <div class="page-container">
        <div class="calendar-wrapper">
          <!-- Calendar Controls -->
          <div class="calendar-controls">
            <div class="calendar-month-title" id="calMonthTitle">October 2026</div>

            <div class="calendar-nav-buttons">
              <button class="btn-secondary" id="calTodayBtn">Today</button>
              <button class="btn-icon" id="calPrevBtn" title="Previous Month" style="border: 1px solid var(--border-subtle);">
                <i class="fa-solid fa-chevron-left"></i>
              </button>
              <button class="btn-icon" id="calNextBtn" title="Next Month" style="border: 1px solid var(--border-subtle);">
                <i class="fa-solid fa-chevron-right"></i>
              </button>
            </div>
          </div>

          <!-- Weekdays Row -->
          <div class="calendar-weekdays-grid">
            <div>Sun</div>
            <div>Mon</div>
            <div>Tue</div>
            <div>Wed</div>
            <div>Thu</div>
            <div>Fri</div>
            <div>Sat</div>
          </div>

          <!-- Days Grid -->
          <div class="calendar-days-grid" id="calendarDaysGrid">
            <!-- Dynamically populated day cells -->
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Day Details Inspector Modal -->
  <div class="modal-backdrop" id="dayDetailsModal">
    <div class="modal-window" style="max-width: 480px;">
      <div class="modal-header">
        <h3 class="modal-title" id="dayModalTitle">Scheduled Tasks</h3>
        <button class="btn-icon" onclick="document.getElementById('dayDetailsModal').classList.remove('active')">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <div class="modal-body">
        <div class="quick-task-list" id="dayModalTasksList">
          <!-- Dynamically populated tasks for clicked day -->
        </div>
      </div>

      <div class="modal-footer" style="justify-content: space-between;">
        <button type="button" class="btn-secondary" onclick="document.getElementById('dayDetailsModal').classList.remove('active')">Close</button>
        <button type="button" class="btn-primary" id="dayModalAddTaskBtn">
          <i class="fa-solid fa-plus"></i> Add Task For This Date
        </button>
      </div>
    </div>
  </div>

  <!-- Shared Global Task Modal (Create & Edit) -->
  <div class="modal-backdrop" id="taskModal">
    <div class="modal-window">
      <div class="modal-header">
        <h3 class="modal-title" id="taskModalTitle">Create New Task</h3>
        <button class="btn-icon modal-close" title="Close">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <form id="taskForm">
        <div class="modal-body">
          <input type="hidden" id="modalTaskId">

          <div class="form-group">
            <label class="form-label" for="modalTaskTitle">Task Title *</label>
            <input type="text" id="modalTaskTitle" class="form-control" placeholder="e.g. Complete sprint deliverables" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="modalTaskDesc">Description</label>
            <textarea id="modalTaskDesc" class="form-control" rows="3" placeholder="Provide extra details or instructions..."></textarea>
          </div>

          <div class="form-group">
            <label class="form-label">Priority</label>
            <div class="priority-selector">
              <label class="priority-option">
                <input type="radio" name="priority" value="low">
                <div class="priority-box opt-low"><i class="fa-solid fa-arrow-down"></i> Low</div>
              </label>
              <label class="priority-option">
                <input type="radio" name="priority" value="medium" checked>
                <div class="priority-box opt-medium"><i class="fa-solid fa-minus"></i> Medium</div>
              </label>
              <label class="priority-option">
                <input type="radio" name="priority" value="high">
                <div class="priority-box opt-high"><i class="fa-solid fa-arrow-up"></i> High</div>
              </label>
              <label class="priority-option">
                <input type="radio" name="priority" value="urgent">
                <div class="priority-box opt-urgent"><i class="fa-solid fa-fire"></i> Urgent</div>
              </label>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="modalTaskCategory">Category</label>
              <select id="modalTaskCategory" class="form-control">
                <option value="Work">Work</option>
                <option value="Personal">Personal</option>
                <option value="Study">Study</option>
                <option value="Shopping">Shopping</option>
                <option value="Health">Health</option>
                <option value="Other">Other</option>
              </select>
            </div>

            <div class="form-group">
              <label class="form-label" for="modalTaskStatus">Status</label>
              <select id="modalTaskStatus" class="form-control">
                <option value="todo">To Do</option>
                <option value="in-progress">In Progress</option>
                <option value="completed">Completed</option>
              </select>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="modalTaskDueDate">Due Date</label>
              <input type="date" id="modalTaskDueDate" class="form-control">
            </div>

            <div class="form-group">
              <label class="form-label">Tags (Type & Press Enter)</label>
              <div class="tags-input-container">
                <input type="text" id="modalTaskTagInput" placeholder="Add tag...">
              </div>
            </div>
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn-secondary modal-close">Cancel</button>
          <button type="submit" class="btn-primary">Save Task</button>
        </div>
      </form>
    </div>
  </div>

  <div class="toast-container"></div>

  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/calendar.js"></script>
  <script>
    // Handle form submit on calendar page
    document.getElementById('taskForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      const title = document.getElementById('modalTaskTitle').value.trim();
      const description = document.getElementById('modalTaskDesc').value.trim();
      const category = document.getElementById('modalTaskCategory').value;
      const dueDate = document.getElementById('modalTaskDueDate').value;
      const status = document.getElementById('modalTaskStatus').value;
      const checkedPriority = form.querySelector('input[name="priority"]:checked');
      const priority = checkedPriority ? checkedPriority.value : 'medium';

      const tagPills = form.querySelectorAll('.tag-badge-pill');
      const tags = Array.from(tagPills).map(p => p.textContent.replace(/[\n#\s]/g, '').trim()).filter(Boolean);

      try {
        await window.API.tasks.create({
          title,
          description,
          category,
          priority,
          status,
          dueDate: dueDate || null,
          tags,
        });

        if (window.showToast) window.showToast('Task scheduled successfully!', 'success');
        document.getElementById('taskModal').classList.remove('active');
        // Reload calendar
        loadMonthCalendar();
      } catch (err) {
        if (window.showToast) window.showToast(err.message, 'error');
      }
    });
  </script>
</body>
</html>
