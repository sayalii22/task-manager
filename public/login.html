<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sign in to your modern Task Manager account to organize, track, and complete your projects.">
  <title>Sign In &bull; TaskPulse Manager</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-brand-logo">
          <i class="fa-solid fa-list-check"></i>
        </div>
        <h1 class="auth-title">Welcome Back</h1>
        <p class="auth-subtitle">Sign in to access your dashboard and organize your tasks</p>
      </div>

      <form id="loginForm" class="auth-form">
        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <input
            type="email"
            id="email"
            class="form-control"
            placeholder="name@example.com"
            required
            autocomplete="email"
          >
        </div>

        <div class="form-group">
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <label class="form-label" for="password">Password</label>
          </div>
          <input
            type="password"
            id="password"
            class="form-control"
            placeholder="••••••••"
            required
            autocomplete="current-password"
          >
        </div>

        <button type="submit" class="btn-primary" style="width: 100%; justify-content: center; padding: 12px; margin-top: 8px;">
          Sign In <i class="fa-solid fa-arrow-right"></i>
        </button>
      </form>

      <div class="demo-account-box">
        <p style="font-size: 0.8rem; color: var(--text-tertiary); margin-bottom: 8px;">
          Testing the application?
        </p>
        <button id="demoLoginBtn" class="btn-secondary" style="width: 100%; justify-content: center; font-size: 0.85rem;">
          <i class="fa-solid fa-bolt" style="color: #f59e0b;"></i> Explore Demo Account (1-Click)
        </button>
      </div>

      <div class="auth-footer">
        Don't have an account? <a href="/register">Create an account</a>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
